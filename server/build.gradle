plugins {
    id 'war'
    id 'org.gretty' version '3.1.1'
}

gretty {
    httpPort = 8800
    servletContainer = 'tomcat9'
}

dependencies {
    implementation 'com.google.inject:guice:5.1.0'
    implementation 'com.google.inject.extensions:guice-servlet:5.1.0'

    implementation 'org.glassfish.jersey.containers:jersey-container-servlet:2.39.1'
    implementation 'org.glassfish.jersey.inject:jersey-hk2:2.39.1'
    implementation 'org.glassfish.jersey.media:jersey-media-json-binding:2.39.1'

    implementation 'org.glassfish.hk2:guice-bridge:2.6.1'

    compileOnly 'javax.servlet:javax.servlet-api:4.0.1'

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.0'
    testImplementation 'org.mockito:mockito-core:5.5.0'
}

test {
    useJUnitPlatform()
}
